<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfume Boutique - Resumen</title>
    <style>
        *{box-sizing:border-box}
        body{margin:0;font-family:Arial,sans-serif;background:#f8f1f5;color:#3d3037}
        .header{background:linear-gradient(135deg,#6d304f,#a45d7e);color:white;text-align:center;padding:30px}
        .header h1{margin:0;font-family:Georgia,serif;font-size:36px}
        .header p{margin-bottom:0}
        .contenedor{width:92%;max-width:750px;margin:35px auto}
        .ticket{background:white;border-radius:18px;padding:32px;box-shadow:0 7px 22px rgba(0,0,0,.1)}
        .titulo{text-align:center;color:#7b3d5b;font-family:Georgia,serif;font-size:27px;margin-top:0}
        .mensaje{text-align:center;color:#777;margin-bottom:25px}
        .dato{display:flex;justify-content:space-between;gap:20px;padding:12px 0;border-bottom:1px solid #eee}
        .dato strong{color:#7b3d5b}
        .seccion{margin-top:25px;padding:18px;background:#fff9fb;border:1px solid #ead9e1;border-radius:12px}
        .seccion h3{margin-top:0;color:#7b3d5b;font-family:Georgia,serif}
        .seccion ul{margin-bottom:0;line-height:1.8;padding-left:22px}
        .descuento{color:#a33b5d}
        .entrega-gratis{color:#5c876c;font-weight:bold}
        .total{margin-top:25px;background:linear-gradient(135deg,#7b3d5b,#a45d7e);color:white;padding:22px;border-radius:12px;text-align:center;font-size:25px;font-weight:bold}
        .gracias{text-align:center;margin-top:25px;color:#777}
        .volver{display:block;text-align:center;margin-top:20px;color:#7b3d5b;text-decoration:none;font-weight:bold}
        .volver:hover{text-decoration:underline}
        .error{background:#ffe5eb;color:#8b2948;padding:18px;border-radius:10px;text-align:center}
        .vacio{color:#777}
        @media(max-width:600px){.ticket{padding:22px}.dato{flex-direction:column;gap:5px}}
    </style>
</head>
<body>
    <div class="header">
        <h1>Perfume Boutique</h1>
        <p>Gracias por elegirnos</p>
    </div>

    <div class="contenedor">
        <div class="ticket" id="resumen"></div>
    </div>

    <script>
        const datosGuardados = sessionStorage.getItem("pedidoPerfumeBoutique");
        const resumen = document.getElementById("resumen");

        if(!datosGuardados){
            resumen.innerHTML = `
                <div class="error">
                    <h2>No hay ningún pedido registrado.</h2>
                    <p>Regresa al formulario para crear tu pedido.</p>
                    <a class="volver" href="MiproyectoFinal1.html">← Volver al formulario</a>
                </div>`;
        } else {
            const pedido = JSON.parse(datosGuardados);

            const subtotal = pedido.perfumes.reduce((suma, perfume) => suma + perfume.precio * pedido.cantidad, 0);
            const totalExtras = pedido.extras.reduce((suma, extra) => suma + extra.precio, 0);
            const subtotalConExtras = subtotal + totalExtras;

            const descuentoCantidad = pedido.cantidad >= 3 ? subtotalConExtras * 0.10 : 0;
            const descuentoEstudiante = pedido.tipo_cliente === "Estudiante" ? subtotalConExtras * 0.05 : 0;
            const totalDescuentos = descuentoCantidad + descuentoEstudiante;
            const totalConDescuentos = subtotalConExtras - totalDescuentos;

            let costoEntrega = 0;
            if(pedido.entrega === "Express"){
                costoEntrega = 7;
            } else if(pedido.entrega === "Domicilio"){
                costoEntrega = totalConDescuentos > 50 ? 0 : 4;
            }

            const totalPagar = totalConDescuentos + costoEntrega;

            const dinero = numero => "$" + numero.toFixed(2);

            const listaPerfumes = pedido.perfumes.map(p =>
                `<li>${p.nombre} — ${dinero(p.precio)} × ${pedido.cantidad} = <strong>${dinero(p.precio * pedido.cantidad)}</strong></li>`
            ).join("");

            const listaExtras = pedido.extras.length
                ? pedido.extras.map(e => `<li>${e.nombre} — ${dinero(e.precio)}</li>`).join("")
                : '<li class="vacio">No se seleccionaron extras.</li>';

            const entregaTexto = costoEntrega === 0
                ? '<span class="entrega-gratis">Gratis</span>'
                : dinero(costoEntrega);

            resumen.innerHTML = `
                <h2 class="titulo">✦ Resumen de tu pedido ✦</h2>
                <p class="mensaje">Estos son los detalles de tu compra.</p>

                <div class="dato"><strong>Cliente</strong><span>${escapeHTML(pedido.nombre)}</span></div>
                <div class="dato"><strong>Tipo de cliente</strong><span>${escapeHTML(pedido.tipo_cliente)}</span></div>
                <div class="dato"><strong>Cantidad de cada perfume</strong><span>${pedido.cantidad}</span></div>

                <div class="seccion">
                    <h3>Perfumes seleccionados</h3>
                    <ul>${listaPerfumes}</ul>
                </div>

                <div class="seccion">
                    <h3>Extras</h3>
                    <ul>${listaExtras}</ul>
                </div>

                <div class="dato"><strong>Método de entrega</strong><span>${escapeHTML(pedido.entrega)}</span></div>

                <br>

                <div class="dato"><strong>Subtotal</strong><span>${dinero(subtotal)}</span></div>
                <div class="dato"><strong>Extras</strong><span>${dinero(totalExtras)}</span></div>
                <div class="dato"><strong>Subtotal con extras</strong><span>${dinero(subtotalConExtras)}</span></div>
                <div class="dato descuento"><strong>Descuento por cantidad</strong><span>-${dinero(descuentoCantidad)}</span></div>
                <div class="dato descuento"><strong>Descuento estudiante</strong><span>-${dinero(descuentoEstudiante)}</span></div>
                <div class="dato"><strong>Entrega</strong><span>${entregaTexto}</span></div>

                <div class="total">
                    TOTAL A PAGAR<br>
                    ${dinero(totalPagar)}
                </div>

                <p class="gracias">Gracias por comprar en <strong>Perfume Boutique</strong>.</p>
                <a class="volver" href="MiproyectoFinal1.html">← Realizar otro pedido</a>
            `;
        }

        function escapeHTML(text){
            return String(text).replace(/[&<>"']/g, function(c){
                return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c];
            });
        }
    </script>
</body>
</html>
